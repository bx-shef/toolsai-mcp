# MCP-сервер и его Redis. На сервере образ берётся из GHCR по тегу коммита (MCP_IMAGE в .env,
# тег подставляет скрипт выката). Локальная сборка — оверлей docker-compose.build.yml.
name: mcp

services:
  mcp:
    image: ${MCP_IMAGE:-ghcr.io/bx-shef/toolsai-mcp:latest}
    container_name: mcp
    env_file: .env
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD:?Задайте REDIS_PASSWORD в .env}@redis:6379
    # Только локально: снаружи сервер виден через nginx портала (docs/DEPLOY_BITRIXVM.md, шаг nginx).
    # ⚠ Не убирать 127.0.0.1: Docker пишет свои правила iptables в обход firewalld, и порт
    # оказался бы открыт на внешнем адресе VM.
    ports:
      - "127.0.0.1:${MCP_PORT:-3100}:3000"
    read_only: true
    tmpfs:
      - /tmp:size=16m
    # Своя иконка коннектора: ./branding/icon.png (или .svg, .jpg). Каталога нет — Docker создаст пустой,
    # будет встроенная иконка.
    volumes:
      - ./branding:/branding:ro
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    cpus: ${MCP_CPUS:-1}
    mem_limit: ${MCP_MEM_LIMIT:-512m}
    restart: unless-stopped
    depends_on: [redis]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  redis:
    image: redis:7.4.6-alpine
    container_name: mcp-redis
    # Сессии клиентов и токены Битрикс24 сотрудников (refresh — зашифрован ENCRYPTION_KEY).
    # Порт не опубликован, Redis виден только в сети compose; пароль — чтобы соседний контейнер в той
    # же сети не прочёл сессии. protected-mode no: с yes Redis отказывает контейнеру mcp (проверено).
    # maxmemory + noeviction: флуд регистраций упрётся в отказ записи, а не в OOM контейнера, и
    # токены сотрудников не будут вытеснены.
    command: ["sh", "-c", "exec redis-server --appendonly yes --save '' --protected-mode no --maxmemory 64mb --maxmemory-policy noeviction --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Задайте REDIS_PASSWORD в .env}
    # Сразу от uid redis (999) и без capabilities. Том — именованный: Docker создаёт его с владельцем
    # /data из образа, поэтому chown не нужен (с каталогом ./redis entrypoint пытался chown и падал).
    user: "999:999"
    volumes:
      - redis:/data
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  redis:
