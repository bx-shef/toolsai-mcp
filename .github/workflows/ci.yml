name: CI

# PR   → ci (типы → сборка → тесты → shellcheck) + docker-build (образ собирается, в реестр не идёт).
# main → ci → publish (образ в GHCR с тегами latest и sha-<коммит>). Сервер сам опрашивает git и
# тянет образ своего коммита (deploy/bitrixvm/mcp-deploy.sh, docs/DEPLOY_BITRIXVM.md).
#
# paths-ignore нет намеренно: образ есть у КАЖДОГО коммита main, иначе сервер ждал бы образ
# коммита только с документацией.
#
# Имена джоб `ci` и `docker-build` — обязательные проверки в правиле защиты `main`
# (docs/REPO_SETUP_CHECKLIST.md): переименовывать только вместе с правилом.
#
# Сторонние actions закреплены полным SHA (как в toolsai-mp3-txt), комментарий `# vX.Y.Z` читает Dependabot.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: '22.22.0'   # как в Dockerfile
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        # Сквозные тесты гоняют собранный сервер (.output)
        run: npm run build

      - name: Test
        run: npm test

      - name: Lint deploy script (shellcheck)
        run: shellcheck deploy/bitrixvm/mcp-deploy.sh

  docker-build:
    name: docker-build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          cache-from: type=gha,scope=mcp
          tags: toolsai-mcp:ci

  publish:
    name: Build & Push to GHCR
    # Красный CI не пускает образ в GHCR, а значит и на сервер.
    needs: ci
    if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      # COMMIT_SHA показывает GET /health; скрипт выката по нему убеждается, что поднялся новый образ.
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          build-args: COMMIT_SHA=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=mcp
          cache-to: type=gha,mode=max,scope=mcp
