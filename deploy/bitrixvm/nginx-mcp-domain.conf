# Свой домен для MCP-сервера (например mcp-bel.bx-shef.by) на VM Битрикс24 — docs/DEPLOY_BITRIXVM.md,
# раздел «Свой домен». Схема — как у импорта из клиент-банка (bx-shef/client-bank-alfa-by,
# deploy/bitrixvm/nginx/00-app-proxy.conf).
#
# КУДА КЛАСТЬ: /etc/nginx/bx/site_settings/<домен>/00-mcp-proxy.conf
#   Сайт и сертификат — штатным меню bitrix-env; этот каталог меню подключает ВНУТРИ server сайта и
#   при своих операциях не трогает.
# ПРОВЕРКА:    nginx -t && systemctl reload nginx
#
# ⚠ Своего server и своего `location /` нет: дубль server_name nginx отдал бы блоку BitrixVM,
# дубль location — отказ старта. bx/conf/bitrix.conf проксирует в переменную $proxyserver —
# переопределяем её, и `location /` сайта уходит в наш контейнер.
set $proxyserver "http://127.0.0.1:3100";

# Свои пути — явно и с ^~: правила по маскам из bitrix.conf / bitrix_general.conf / bitrix_block.conf
# (точки в начале имени, статика) их не перехватят. Зона mcp_ai — в http { } (bx/settings/mcp-ai.conf).

# Метаданные OAuth (RFC 8414 / 9728)
location ^~ /.well-known/oauth- {
    proxy_pass $proxyserver;
}
location = /.well-known/openid-configuration {
    proxy_pass $proxyserver;
}

# Вход: регистрация клиента, экран согласия, возврат с портала, токены
location ^~ /oauth/ {
    limit_req zone=mcp_ai burst=40 nodelay;
    proxy_pass $proxyserver;
}

# MCP (Streamable HTTP): ответ потоком — без буфера и с долгим чтением
location ^~ /mcp {
    limit_req zone=mcp_ai burst=40 nodelay;
    limit_conn mcp_ai_conn 20;
    proxy_pass $proxyserver;
    proxy_buffering off;
    proxy_read_timeout 300s;
}

location = /health {
    proxy_pass $proxyserver;
}
location = /icon {
    proxy_pass $proxyserver;
}

client_max_body_size 1m;
proxy_http_version 1.1;
proxy_set_header Connection "";
# Host и X-Forwarded-* задаёт конфиг сайта: второй proxy_set_header Host дал бы два заголовка.
