# Вставка в server { } HTTPS-сайта портала (bitrix-env) — docs/DEPLOY_BITRIXVM.md, шаг 4.
# Снаружи: https://<портал>/mcp-ai/…  →  контейнер mcp на 127.0.0.1:3100 без префикса.

# Метаданные OAuth со вставкой пути (RFC 8414 / RFC 9728): клиенты ищут их в корне хоста.
# Только эти точные адреса — остальной /.well-known портала не трогаем.
location = /.well-known/oauth-authorization-server/mcp-ai { proxy_pass http://127.0.0.1:3100/.well-known/oauth-authorization-server; }
location = /.well-known/openid-configuration/mcp-ai       { proxy_pass http://127.0.0.1:3100/.well-known/openid-configuration; }
location = /.well-known/oauth-protected-resource/mcp-ai/mcp { proxy_pass http://127.0.0.1:3100/.well-known/oauth-protected-resource; }

location /mcp-ai/ {
    # Частота: вход, регистрация клиентов и вызовы — с одного адреса не чаще 10 в секунду.
    # Зона mcp_ai объявляется в http { } (см. DEPLOY_BITRIXVM.md).
    limit_req zone=mcp_ai burst=40 nodelay;

    proxy_pass http://127.0.0.1:3100/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    # Streamable HTTP отвечает потоком SSE — без буфера и с долгим чтением
    proxy_buffering off;
    proxy_read_timeout 300s;
    client_max_body_size 1m;
    # Не больше 20 одновременных соединений с адреса (поток SSE держит соединение до 300 с).
    # Зона mcp_ai_conn — тоже в http { }.
    limit_conn mcp_ai_conn 20;
}
